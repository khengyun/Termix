services:
  termix:
    image: ${TERMIX_IMAGE:-termix:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: termix
    restart: unless-stopped
    ports:
      - "8080:8080"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - termix-data:/app/data
      - tailscale-state:/var/lib/tailscale
    environment:
      PORT: "8080"
      GUACD_HOST: "guacd"
      ENABLE_TAILSCALE: true
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
    depends_on:
      - guacd
    networks:
      - termix-net

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    restart: unless-stopped
    networks:
      - termix-net

volumes:
  termix-data:
    name: termix-data
    driver: local
  tailscale-state:
    name: tailscale-state
    driver: local

networks:
  termix-net:
    driver: bridge
