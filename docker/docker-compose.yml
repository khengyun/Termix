services:
  termix:
    image: ${TERMIX_IMAGE:-termix:latest}
    container_name: termix
    restart: unless-stopped
    network_mode: host
    volumes:
      - termix-data:/app/data
    environment:
      PORT: "8080"
      GUACD_HOST: "guacd"
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    network_mode: host
    restart: unless-stopped

volumes:
  termix-data:
    name: termix-data
    driver: local
