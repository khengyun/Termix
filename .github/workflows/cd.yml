name: CD

on:
  push:
    branches:
      - selfhost
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy
    needs: build
    runs-on:
      - self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy
        env:
          TERMIX_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          docker compose -f docker/docker-compose.yml pull
          docker compose -f docker/docker-compose.yml up -d --remove-orphans
          docker compose -f docker/docker-compose.yml ps

      - name: Verify deployment
        run: |
          for i in $(seq 1 12); do
            status=$(docker inspect --format='{{.State.Health.Status}}' termix 2>/dev/null || echo "missing")
            echo "termix health: $status (attempt $i)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "missing" ] || docker inspect --format='{{.State.Status}}' termix | grep -qv running; then
              echo "Container is not running:"
              docker logs --tail 50 termix || true
              exit 1
            fi
            sleep 10
          done
          echo "Container never became healthy:"
          docker logs --tail 50 termix
          exit 1
